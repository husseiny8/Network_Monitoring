{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}404 | پایش شبکه{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="error-page">
  <div class="error-card">
    <img src="{% static 'images/error-404.png' %}" alt="خطا" class="error-illustration">
    <h1>{% block error_title %}صفحه پیدا نشد{% endblock %}</h1>
    <p class="muted">{% block error_message %}آدرس مورد نظر وجود ندارد یا منتقل شده است.{% endblock %}</p>
    <a class="btn primary" href="{% url 'dashboard' %}">بازگشت به داشبورد</a>
  </div>
</body>
</html>
