{% extends "base.html" %}
{% block title %}تنظیمات اعلان‌ها | پایش شبکه{% endblock %}
{% block content %}
<section class="page-header"><div><h1>تنظیمات اعلان‌ها</h1><p class="muted">مدیریت پیام‌ها و هشدارها.</p></div></section>
<section class="panel">
  <form method="post" action="{% url "settings_notifications" %}">
    {% csrf_token %}
    <div class="toggle-list">

      <div class="toggle-row">
        <label class="switch">
          <input type="checkbox" id="notify_email" name="notify_email" {% if settings.notify_email %}checked{% endif %}>
          <span class="switch-track"><span class="switch-thumb"></span></span>
        </label>
        <label for="notify_email" class="toggle-title">ارسال ایمیل</label>
      </div>

      <div class="toggle-row">
        <label class="switch">
          <input type="checkbox" id="notify_in_app" name="notify_in_app" {% if settings.notify_in_app %}checked{% endif %}>
          <span class="switch-track"><span class="switch-thumb"></span></span>
        </label>
        <label for="notify_in_app" class="toggle-title">ارسال پیام داخل پنل</label>
      </div>

      <div class="toggle-row">
        <label class="switch">
          <input type="checkbox" id="notify_on_critical" name="notify_on_critical" {% if settings.notify_on_critical %}checked{% endif %}>
          <span class="switch-track"><span class="switch-thumb"></span></span>
        </label>
        <label for="notify_on_critical" class="toggle-title">اعلان برای وضعیت بحرانی</label>
      </div>

    </div>
    <div class="form-actions" style="margin-top:16px"><button class="btn primary" type="submit">ذخیره تنظیمات</button></div>
  </form>
</section>
{% endblock %}
