{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101830">
  <title>{% block title %}خطا{% endblock %} | پایش شبکه</title>

  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.1/Vazirmatn-font-face.css">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="error-page">
  {% include "includes/icons.html" %}

  <div class="error-card">
    <span class="error-code">{% block error_code %}ERROR{% endblock %}</span>
    <img src="{% static 'images/empty-state.svg' %}" alt="" class="error-illustration">
    <h1>{% block error_title %}خطایی رخ داد{% endblock %}</h1>
    <p class="muted">{% block error_message %}لطفاً دوباره تلاش کنید.{% endblock %}</p>
    <a class="btn btn-primary" href="{% url 'dashboard' %}">
      <svg class="icon"><use href="#icon-dashboard"></use></svg>
      بازگشت به داشبورد
    </a>
  </div>
</body>
</html>
