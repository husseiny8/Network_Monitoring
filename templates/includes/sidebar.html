{% load static %}
<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <img src="{% static 'images/icons8-internet-96.png' %}" alt="Logo" class="brand-logo">
    <div>
      <div class="brand-title">Network Monitor</div>
      <div class="brand-subtitle">پایش زنده شبکه</div>
    </div>
  </div>

  <nav class="nav-menu">
    <a href="{% url "dashboard" %}" class="nav-item{% if request.resolver_match.url_name == "dashboard" %} active{% endif %}">
      <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M3 12h4l2-7 4 14 2-7h6"/></svg></span>
      داشبورد
    </a>
    <a href="{% url "devices" %}" class="nav-item{% if request.resolver_match.url_name == "devices" or request.resolver_match.url_name == "device_detail" %} active{% endif %}">
      <span class="nav-icon"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="6" rx="1.5"/><rect x="4" y="14" width="16" height="6" rx="1.5"/><circle cx="8" cy="7" r="1" fill="currentColor" stroke="none"/><circle cx="8" cy="17" r="1" fill="currentColor" stroke="none"/></svg></span>
      دستگاه‌ها
    </a>
    <a href="{% url "alerts" %}" class="nav-item{% if request.resolver_match.url_name == "alerts" or request.resolver_match.url_name == "alert_detail" %} active{% endif %}">
      <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M12 3a5 5 0 00-5 5v3.2c0 .9-.3 1.8-.9 2.5L5 16h14l-1.1-2.3a4 4 0 01-.9-2.5V8a5 5 0 00-5-5z"/><path d="M9.5 18a2.5 2.5 0 005 0"/></svg></span>
      هشدارها
    </a>
    <a href="{% url "reports" %}" class="nav-item{% if request.resolver_match.url_name == "reports" or request.resolver_match.url_name == "report_detail" %} active{% endif %}">
      <span class="nav-icon"><svg viewBox="0 0 24 24"><rect x="4" y="12" width="3.5" height="8"/><rect x="10.25" y="7" width="3.5" height="13"/><rect x="16.5" y="4" width="3.5" height="16"/></svg></span>
      گزارش‌ها
    </a>
    <a href="{% url "dns_lookup" %}" class="nav-item{% if request.resolver_match.url_name == "dns_lookup" %} active{% endif %}">
      <span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="M20 20l-5.2-5.2"/></svg></span>
      جستجوی DNS
    </a>
    {% if request.user.is_staff %}
    <a href="{% url "users" %}" class="nav-item{% if request.resolver_match.url_name == "users" or request.resolver_match.url_name == "user_create" or request.resolver_match.url_name == "user_edit" %} active{% endif %}">
      <span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M15 14.2c2.9.4 5 2.7 5 5.8"/></svg></span>
      کاربران
    </a>
    {% endif %}
    <a href="{% url "settings" %}" class="nav-item{% if request.resolver_match.url_name == "settings" or request.resolver_match.url_name == "settings_notifications" or request.resolver_match.url_name == "settings_ping" %} active{% endif %}">
      <span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v2.4M12 18.6V21M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M3 12h2.4M18.6 12H21M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7"/></svg></span>
      تنظیمات
    </a>
  </nav>

  <div class="sidebar-footer">
    <span class="status-dot"></span>
    <span>سیستم فعال و در حال پایش</span>
  </div>
</aside>
