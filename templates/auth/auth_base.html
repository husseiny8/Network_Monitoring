{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="سامانه پایش، تحلیل و تشخیص اختلالات شبکه و اینترنت">
  <meta name="theme-color" content="#101830">
  <title>{% block title %}Network Monitor{% endblock %}</title>

  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.1/Vazirmatn-font-face.css">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="auth-page">
  {% include "includes/icons.html" %}

  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-logo"><svg class="icon"><use href="#icon-activity"></use></svg></div>
      {% block auth_content %}{% endblock %}
    </div>

    <div class="auth-side">
      <div class="auth-side-art">
        <svg viewBox="0 0 220 220"><use href="#graphic-network"></use></svg>
        <h2>پایش لحظه‌ای شبکه</h2>
        <p>وضعیت دستگاه‌ها، سرویس‌ها و اتصال اینترنت را به‌صورت زنده و یکجا دنبال کنید.</p>
      </div>
    </div>
  </div>

  <script src="{% static 'js/app.js' %}"></script>
</body>
</html>
